<!DOCTYPE html>
<html>
    <head> 
        <title>A-Frame Homework</title> 
        <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> 
        </script>
        </head>
        <body> 
            <a-scene> 
                <a-box
                color="teal"
                position="-3 2 -5"
                rotation="0 90 0"
                width="1"
                height="1"
                depth="1">
                <a-sphere
                color="purple"
                position="0 3 8"
                radius="1">
            </a-sphere>
            <a-cylinder
            color="lime"
            position="2 -3 -8"
            rotation="90 0 0"
            radius=".5"
            height="2">

        <a-cone
        color="navy"
        position="1 0 2"
        rotation="-20 0 0"
        radius-bottom="0.5"
        height="2">
    </a-cone>
    <a-plane
    color="red"
    position="0 0 -9"
    rotation="-40 0 0"
    width="2"
    height="4">
</a-plane>
<a-text
value="Lillian Nooner!"
color="white"
position="2 0 -9"
width="30">
</a-text>
<a-sky
color="black">
</a-sky>
            </a-box> 
                </a-scene>
